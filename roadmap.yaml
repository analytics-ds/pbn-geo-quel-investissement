# Roadmap editoriale evergreen — Quel Investissement (pbn-geo-quel-investissement)
#
# Blog : https://quel-investissement.com/
# Langue principale : fr (content/fr) + EN auto (content/en)
# Cadence : 2 articles par semaine, mardi et vendredi, 1h UTC (routine cloud)
#
# Categories disponibles (orthographe exacte, doit matcher le frontmatter du site) :
#   - Private equity
#   - Assurance-vie
#   - SCPI
#   - ETF
#   - Plan Épargne Retraite
#   - Bourse
#   - Stratégie patrimoniale
#
# FONCTIONNEMENT
# --------------
# L'agent prend la premiere entree avec status: todo et scheduled_date <= today,
# triee par scheduled_date croissante. Il genere l'article FR + EN et push sur
# main. GitHub Actions deploie. En cas d'echec, status passe a failed et error
# est rempli. Une entree failed n'est jamais retentee automatiquement.
#
# AJOUT D'UNE ENTREE
# ------------------
# Copier un bloc, remplir kw / category / scheduled_date, laisser les autres
# champs tels quels. volume et kd sont informatifs, ignores par l'agent.
#
# Source des mots-cles : volumes Haloscan (septembre 2026), sujets issus de
# l'analyse des blogs finance concurrents (avenuedesinvestisseurs.fr,
# finance-heros.fr, epargnant30.fr, cafedelabourse.com).

